title: El diputado provincial José Alberto Rodríguez participa en la presentación de «Maderadas en los ríos Segura y Guadalquivir»
fecha: 2026-02-02
fecha_humana: 2 feb 2026
categoria: Presentación
medio: Diputación de Jaén
lede: El proyecto, promovido por la Diputación de Jaén, se presentó como un documento audiovisual de considerable valor etnográfico.

body: |
  El Aula de Cultura de la Diputación ha acogido esta tarde la presentación del documental *Maderadas en los ríos Segura y Guadalquivir*, promovido por la Asociación Cultural La Esparteña de Santiago-Pontones y con el patrocinio de la Administración provincial.

  El diputado provincial José Alberto Rodríguez ha sido el encargado de presentar este proyecto audiovisual junto a algunos de sus responsables: el director y guionista del documental, José Laso; Isabel Pereira, encargada de producción y ayudante de montaje; y el etnólogo Francisco Jiménez.

  En este acto, al que han asistido más de medio centenar de personas, José Alberto Rodríguez ha definido este documental como «un gran proyecto que incluye imágenes y testimonios de algo que es historia viva de la Sierra de Segura», una comarca «con identidad propia que se puede narrar a través de sus ríos, una historia que debe ser contada y que es un legado para la gente».

  Por ello, ha agradecido a José Laso «todo el trabajo que hace por la Sierra de Segura y por defender el acervo cultural serrano» con trabajos como el que se ha presentado hoy en el Palacio Provincial de la Diputación.

  > Se recogen testimonios reales de los últimos pineros gancheros, gracias a los cuales se transportaron río abajo, del Segura y del Guadalquivir, miles y miles de troncos para las navieras.
  >
  > — José Laso, director del documental

  El director de esta cinta de 53 minutos ha subrayado el valor histórico del oficio dentro de las tradiciones de la Sierra de Segura y la de Cazorla.
