title: Entrevista a José Laso en Radio Jaén Cadena SER
fecha: 2026-02-02
fecha_humana: 2 feb 2026
categoria: Radio
medio: Radio Jaén · Cadena SER
lede: El director José Laso conversa sobre el proyecto documental y la memoria histórica de la Sierra de Segura.

body: |
  José Laso, director de los documentales que rescatan la memoria histórica de la Sierra de Segura, conversa en Radio Jaén Cadena SER sobre su trayectoria, el proyecto en marcha y su empeño por dignificar a las víctimas anónimas de la posguerra en la sierra.
