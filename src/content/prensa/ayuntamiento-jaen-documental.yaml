title: El Ayuntamiento de Jaén conoce el documental que rescata la memoria del bombardeo
fecha: 2026-02-19
fecha_humana: 19 feb 2026
categoria: Nota de prensa
medio: Ayuntamiento de Jaén
lede: El Ayuntamiento aplaude la iniciativa del grupo de creadores jiennenses que ha promovido un documento audiovisual para rescatar la memoria del episodio.

body: |
  El Ayuntamiento de Jaén aplaude la iniciativa de un grupo de creadores jiennenses que ha promovido la edición de un documento audiovisual para rescatar la memoria del bombardeo de Jaén, uno de los episodios más trágicos y silenciados de la Guerra Civil en la ciudad.

  El proyecto, que se estrena el próximo 23 de abril en la capital jiennense, «nace con el objetivo de recuperar la memoria histórica, dignificar a las víctimas y cubrir un vacío narrativo que hasta ahora solo había sido abordado desde conferencias y publicaciones escritas», asegura el alcalde de la ciudad, Julio Millán, que ha recibido junto al edil de Mantenimiento Urbano, Javier Padorno, a los promotores de la iniciativa.

  La productora, Isabel Pereira, ha contado que la idea surge de la suma de iniciativas que propuso a José Laso, cineasta jiennense con una trayectoria consolidada en el ámbito del documental, porque detectaron «la ausencia de un relato audiovisual sobre el bombardeo de Jaén, pese a la relevancia histórica del suceso y pese a que existían trabajos previos de investigación realizados por autores como Juan Cuevas Mata».

  > Nos dimos cuenta de que este episodio fundamental de nuestra historia no tenía un proyecto audiovisual propio.
  >
  > — Isabel Pereira, productora

  El alcalde ha felicitado que «el documental haya involucrado a numerosas personas de Jaén, tanto en el equipo técnico como artístico, con una apuesta clara por la gente joven y el talento local, especialmente alumnado y profesionales vinculados a la Escuela de Arte José Nogué». La producción corre a cargo de un equipo mayoritariamente jiennense, con José Laso al frente de la dirección y un sólido respaldo en la producción ejecutiva.

  Este audiovisual supone la primera vez que el bombardeo de Jaén es abordado desde el lenguaje del cine, convirtiéndose en una herramienta clave para la divulgación, la reflexión colectiva y la transmisión de la memoria a nuevas generaciones. Para Millán, «el estreno del documental el próximo 23 de abril marcará un hito en la recuperación de la memoria histórica de la ciudad y abrirá la puerta a futuras proyecciones, encuentros y actividades educativas en torno a este episodio olvidado de la historia contemporánea».
