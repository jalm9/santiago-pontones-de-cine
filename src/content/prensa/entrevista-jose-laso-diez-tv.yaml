title: Entrevista a José Laso en Diez TV de Úbeda
fecha: 2025-02-10
fecha_humana: 10 feb 2025
categoria: Televisión
medio: Diez TV, Úbeda
lede: El director de los documentales visita el plató de Diez TV de Úbeda para hablar de su trabajo en la Sierra de Segura.

body: |
  José Laso, director de *Maquis y fugaos en la Sierra de Segura* y de *Maderadas en los ríos Segura y Guadalquivir*, fue entrevistado en el programa de Diez TV de Úbeda para presentar sus proyectos documentales y hablar de la memoria histórica y etnográfica de la comarca.
