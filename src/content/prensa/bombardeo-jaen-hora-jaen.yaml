title: Un documental rescata el bombardeo de Jaén durante la Guerra Civil
fecha: 2026-02-19
fecha_humana: 19 feb 2026
categoria: En prensa
medio: Hora Jaén
lede: El Ayuntamiento de Jaén respalda el documental que, por primera vez en formato audiovisual, aborda uno de los episodios más silenciados de la Guerra Civil en la capital.

body: |
  El Ayuntamiento de Jaén ha mostrado su respaldo al documental que, por primera vez en formato audiovisual, aborda el bombardeo de Jaén, uno de los episodios más trágicos y silenciados de la Guerra Civil en la capital. El alcalde, Julio Millán, se ha reunido con los responsables del proyecto, dirigido por José Laso Flores y producido por Isabel Pereira, cuyo estreno está previsto para el 23 de abril.

  Millán ha subrayado que la película-documental contribuirá a «recuperar la memoria histórica, dignificar a las víctimas y cubrir un vacío narrativo que hasta ahora solo había sido abordado desde conferencias y publicaciones escritas». En el encuentro también participó el concejal de Mantenimiento Urbano, Javier Padorno.

  La productora Isabel Pereira ha explicado que el proyecto nace al constatar la ausencia de un relato audiovisual sobre el bombardeo, pese a su relevancia histórica y a la existencia de investigaciones previas de autores como Juan Cuevas Mata. A partir de ahí, el equipo impulsó una producción que combina rigor histórico, sensibilidad social y participación ciudadana.

  El alcalde ha valorado especialmente la implicación de talento local, con un equipo técnico y artístico mayoritariamente jiennense y una apuesta por la juventud, con participación de alumnado y profesionales vinculados a la Escuela de Arte José Nogué. La dirección recae en José Laso, con un sólido respaldo en la producción ejecutiva.

  Se trata de la primera vez que el bombardeo de Jaén se aborda desde el lenguaje del cine, lo que convierte al documental en una herramienta clave para la divulgación, la reflexión colectiva y la transmisión de la memoria a nuevas generaciones. Para el alcalde, el estreno del 23 de abril «marcará un hito en la recuperación de la memoria histórica de la ciudad» y abrirá la puerta a futuras proyecciones, encuentros y actividades educativas en torno a este episodio olvidado de la historia contemporánea.
