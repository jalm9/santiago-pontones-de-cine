title: La acogida de «Maquis y fugaos» en los medios de comunicación
fecha: 2025-01-12
fecha_humana: 12 ene 2025
categoria: Recopilación
medio: Prensa
lede: Un repaso a la repercusión del documental en radios, periódicos y televisiones a lo largo de sus presentaciones por la comarca.

body: |
  El documental *Maquis y fugaos en la Sierra de Segura* ha tenido una gran acogida en sus presentaciones en las diferentes localidades por las que ha pasado, con cobertura en radios, periódicos digitales y televisiones locales de Andalucía.
