title: «Maquis y fugaos de la Sierra de Segura» gana el primer premio en el Festival Internacional de Cine de Mumbai
fecha: 2025-03-01
fecha_humana: 1 mar 2025
categoria: Premio
medio: Nota de prensa
lede: El documental de José Laso Flores obtiene la Caracola Dorada al Mejor Documental Internacional en el certamen indio.

body: |
  *Maquis y fugaos en la Sierra de Segura* ha obtenido el primer premio en el Festival Internacional de Cine de Mumbai (India) como mejor documental dramático. José Laso Flores, su director, se muestra emocionado y agradecido.

  > Para mí, este reconocimiento es un homenaje a todos los antepasados que lucharon y dieron su vida por la democracia y la libertad, por los que sufrieron la represión; y cómo no, para dignificar y dar visibilidad a tantos hombres y mujeres valientes que hoy en día aún siguen anónimos en fosas comunes repartidas por toda España.
  >
  > — José Laso Flores, director del documental

  Laso recibirá la Caracola Dorada al Mejor Documental Internacional. Mumbai —antes conocida como Bombay— es la ciudad más poblada de la India y la capital del estado de Maharashtra: uno de los centros económicos, financieros y culturales más importantes del país, con más de veinte millones de habitantes en su área metropolitana, principal puerto de la India y sede de la Bolsa de Valores de Bombay (BSE), una de las más grandes del mundo.

  Su Festival de Cine para Documentales, Cortometrajes y Animación (MIFF) arrancó en 1990 y es el más antiguo y prestigioso del Sur de Asia. La ciudad se erige culturalmente como corazón de la industria cinematográfica india, conocida como Bollywood. Entre sus atracciones turísticas destacan la Puerta de la India, la playa de Chowpatty y edificios históricos como la estación de Chhatrapati Shivaji Maharaj, Patrimonio de la Humanidad por la UNESCO.

