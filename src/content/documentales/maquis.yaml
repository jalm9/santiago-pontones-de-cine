director_bio:
  nombre: José Laso Flores
  titulo: Dirección y guion
  foto: ../../assets/equipo/jose-laso.jpeg
  bio: |
    Es uno de tantos emigrantes jiennenses que un buen día decidió volver a su tierra. Han pasado más de dos décadas desde que cambió Girona por la aldea de Los Anchos, en pleno corazón de la Sierra de Segura.

    Su inquietud por divulgar la cultura y el patrimonio del medio rural lo llevó primero a impulsar la asociación cultural La Esparteña y, más tarde, a abrir en su aldea el Museo Etnológico Alma Serrana, que cumple ahora veinticuatro años desde su apertura. En 2012 ganó el primer premio del concurso de cortos exprés con «Couchsurfing».

