sinopsis:
  titulo: Dos maquis, la Guardia Civil, el valle del Segura
  body: |
    Dos maquis huyen de la Guardia Civil por el valle del río Segura. Sixto García Espinosa, «el de Marchena», se había escapado del campo de prisioneros de Guadarrama; José Antonio Fernández Martínez, «el de Miller», de las dependencias carcelarias de Santiago de la Espada.

    La persecución los lleva desde el pantano del Tranco hasta la aldea de Marchena, donde se les incorpora un tercer hombre: Juan Ruiz González, ex alcalde republicano de Yeste, fugado del campo de concentración de Portaceli, en Valencia.

    Un recorrido cargado de acción, emoción y cultura tradicional de alta montaña, en el contexto de una época marcada por las represalias de un régimen dictatorial. Sus historias, sustentadas en testimonios reales, documentos históricos, fotografías y material de época, han sido meticulosamente reconstruidas.

contexto:
  sub: El origen del proyecto
  titulo: De un libro a un largometraje
  body: |
    Mientras José Laso escribía «La sierra profunda, desconocida y olvidada» —un libro sobre historia, costumbres y tradiciones de la comarca— observó, al documentarse, que la figura de los «fugaos» era muy común y que hablar de ellos seguía siendo un poco tabú por miedo a represalias entre quienes vivieron estas sierras en la posguerra.

    Aquello daba para más que un libro o un documental: siguió investigando y empezó a escribir un guion adaptado para largometraje. El documental es el paso previo a «Maquis, la última resistencia», un largometraje en el que la Asociación Cultural Amigos de Nuestras Tradiciones «La Esparteña» sigue trabajando junto a la comunidad de Santiago-Pontones y sus colaboradores.

premio:
  titulo: Caracola Dorada al Mejor Documental Internacional
  medio: Festival Internacional de Cine de Mumbai · MIFF, 2025
  cuerpo: El documental obtuvo el primer premio en el Festival Internacional de Cine de Mumbai —el MIFF, el más antiguo y prestigioso del Sur de Asia— en la categoría de Mejor Documental Internacional en el género dramático.
  cita: Para mí, este reconocimiento es un homenaje a todos los antepasados que lucharon y dieron su vida por la democracia y la libertad, por los que sufrieron la represión; y cómo no, para dignificar y dar visibilidad a tantos hombres y mujeres valientes que hoy siguen anónimos en fosas comunes repartidas por toda España.
  cita_autor: José Laso Flores, director
  img: ../../assets/premios/mumbai-caracola-dorada.jpeg
  img_alt: Caracola Dorada del Festival Internacional de Cine de Mumbai

