sinopsis:
  titulo: Un oficio duro, de riesgo, en alta montaña
  body: |
    El oficio de pinero ganchero fue el más singular y legendario de cuantos vivieron del monte: un trabajo duro y de riesgo que solo un puñado de hombres curtidos podía desarrollar en una orografía y un clima extremos de alta montaña. Hombres que se dejaron la piel cortando árboles, pelándolos, ajorrándolos y bajándolos río abajo.

    Junto a ellos, toda una economía: hacheros, aserradores, descortezadores, pelaores, ajorraores, contratistas madereros, carpinteros, carreteros, gancheros, arrieros, leñadores, maestros de río y mayorales. El documental recoge testimonios reales de los últimos pineros gancheros, gracias a los cuales se transportaron río abajo, del Segura y del Guadalquivir, miles y miles de troncos para las navieras.

    > Se trata de un documento audiovisual histórico de considerable valor etnográfico dentro de los oficios tradicionales de la Sierra de Segura y la de Cazorla.
    >
    > — José Laso, director del documental

contexto:
  sub: Contexto histórico
  titulo: De Fernando III a la provincia marítima
  body: |
    Con la conquista de Granada por los Reyes Católicos desaparecen los conflictos fronterizos, lo que favorece el asentamiento de nuevos colonos en la Sierra de Segura y un fuerte incremento de los aprovechamientos forestales, ganaderos, agrícolas y artesanos.

    Su condición fronteriza hizo que el rey Fernando III otorgase a la comarca un fuero especial con bastantes privilegios, que rigió la vida comunitaria de los segureños hasta 1748. Conocemos esa ley a través de unas ordenanzas elaboradas en 1580 en el Convento de Santa María de la Peña, en Orcera: setenta y dos capítulos basados en el fuero de Cuenca, ampliados y adaptados a las necesidades de la zona, que regulan todas las actividades laborales, económicas y jurídicas y describen cómo era la vida de los vecinos.

    En el siglo XVIII la economía de la madera sufre graves daños al proclamarse la comarca provincia marítima, por decreto del 31 de enero de 1748, vigente hasta 1836. Desde principios de ese siglo la Sierra de Segura se convirtió en el principal abastecedor de madera para las necesidades civiles y militares del país: Ministerio de Marina, Negociado de Hacienda, RENFE, construcción de edificios públicos y privados, mobiliario y artesanía.

